name: sewantara

x-laravel-service: &laravel-service
  image: sewantara-app:${APP_IMAGE_TAG:-latest}
  build:
    context: .
    target: app
    args:
      VITE_APP_NAME: ${APP_NAME:-Sewantara}
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
      VITE_REVERB_HOST: ${REVERB_PUBLIC_HOST}
      VITE_REVERB_PORT: ${REVERB_PUBLIC_PORT:-443}
      VITE_REVERB_SCHEME: ${REVERB_PUBLIC_SCHEME:-https}
  env_file:
    - ${APP_ENV_FILE:-.env.production}
  volumes:
    - app_storage:/var/www/html/storage
  networks:
    - sewantara
  init: true
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sewantara
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    shm_size: 256mb

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    networks:
      - sewantara
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *laravel-service
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  app:
    <<: *laravel-service
    command: ["php-fpm", "-F"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  queue:
    <<: *laravel-service
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --sleep=1
      - --rest=1
      - --tries=3
      - --timeout=90
      - --max-time=3600
      - --no-interaction
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 2m

  scheduler:
    <<: *laravel-service
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  reverb:
    <<: *laravel-service
    command:
      - php
      - artisan
      - reverb:start
      - --host=0.0.0.0
      - --port=8080
      - --no-interaction
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 30s

  nginx:
    image: sewantara-web:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      target: web
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_HTTP_PORT:-8090}:80"
    volumes:
      - app_storage:/var/www/html/storage:ro
    networks:
      - sewantara
    depends_on:
      app:
        condition: service_started
      reverb:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

networks:
  sewantara:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  app_storage:
